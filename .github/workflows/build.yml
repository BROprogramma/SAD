name: Build / check
on:
  workflow_call:
    inputs:
      target_branch:
        description: "Branch om naar terug te pushen (voorkeursweg: door de caller vullen)"
        required: false
        type: string

permissions:
  contents: write

env:
  CHECK_DIR: ".checks"

jobs:
  build:
    name: Snapshot + Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nodig om branches te kunnen vinden die deze commit bevatten

      - name: Prepare directories
        run: |
          mkdir -p static $CHECK_DIR

      - name: Generate HTML snapshot
        run: npx respec --localhost --src index.html --out snapshot.html

      - name: Validate HTML
        continue-on-error: true
        run: |
          npm install -g nu-html-checker
          nu-html-checker snapshot.html

      - name: Check for alternateFormats
        id: config
        run: |
          echo "grep=false" >> $GITHUB_OUTPUT
          if grep -q 'alternateFormats' ./js/config.js; then
            if grep -Pzoq 'alternateFormats:\s*\[\s*\{\s*label:\s*".+?",\s*uri:\s*".+?"\s*\}\s*\]' ./js/config.js; then
              echo "grep=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Copy pdf.js if needed
        if: ${{ steps.config.outputs.grep == 'true' }}
        run: cp .github/workflows/pdf.js .

      - name: Generate PDF(s)
        if: ${{ steps.config.outputs.grep == 'true' }}
        run: |
          cp ./js/config.js config.js
          echo "module.exports = { respecConfig };" >> config.js
          echo "var window = {respecMermaid:{createFigures:null}};" | cat - config.js > temp && mv temp config.js
          npm install puppeteer
          python3 -m http.server 8080 &
          rm -f *.pdf
          node pdf.js
          mv *.pdf static/

      - name: Run WCAG2AA check
        run: |
          npm install -g pa11y
          pa11y snapshot.html \
            --ignore WCAG2AA.Principle4.Guideline4_1.4_1_1.F77 \
            > $CHECK_DIR/wcag-report.txt 2>&1 || echo "Geen WCAG-fouten gevonden." > $CHECK_DIR/wcag-report.txt

      - name: Serve snapshot over HTTP
        uses: Eun/http-server-action@v1
        with:
          directory: ${{ github.workspace }}
          port: 8080
          content-types: |
            {
              "css": "text/css",
              "html": "text/html",
              "ico": "image/x-icon",
              "jpeg": "image/jpeg",
              "jpg": "image/jpeg",
              "js": "text/javascript",
              "json": "application/json",
              "png": "image/png",
              "svg": "image/svg+xml",
              "txt": "text/plain",
              "xml": "text/xml"
            }

      - name: Run link check with Muffet
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go
          go install github.com/raviqqe/muffet@latest
          echo "${HOME}/go/bin" >> $GITHUB_PATH
          muffet \
            --exclude '\.pdf$' \
            --exclude '^https://gitdocumentatie.*' \
            --exclude '^https://docs.geostandaarden.*' \
            --exclude '.*localhost.*' \
            --header 'user-agent:Curl' \
            --ignore-fragments \
            --one-page-only \
            http://localhost:8080/snapshot.html \
            --buffer-size 8192 > $CHECK_DIR/link-check.txt 2>&1 || echo "Geen linkfouten gevonden." > $CHECK_DIR/link-check.txt

      # >>> Nieuw: bepaal de echte target branch
      - name: Determine target branch
        id: tgt
        shell: bash
        run: |
          set -eo pipefail
          TARGET="${{ inputs.target_branch }}"
          if [[ -z "$TARGET" ]]; then
            if [[ "${{ github.ref_type }}" == "branch" ]]; then
              TARGET="${{ github.ref_name }}"
            else
              # Run draait op een tag: zoek een branch die deze commit bevat
              git fetch --all --prune
              TARGET="$(git for-each-ref --format='%(refname:short)' --contains "$(git rev-parse HEAD)" refs/remotes/origin \
                | sed -n 's#^origin/##p' | head -n1)"
              if [[ -z "$TARGET" ]]; then
                # fallback: default branch van origin
                TARGET="$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's#^origin/##')"
              fi
            fi
          fi
          echo "name=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Target branch: $TARGET"

      - name: Commit all results
        env:
          TARGET_BRANCH: ${{ steps.tgt.outputs.name }}
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1) Stash alle wijzigingen (ook untracked), zodat we schoon kunnen pullen
          git stash push --include-untracked -m "ci-artifacts" || true

          # 2) Zorg dat we op de juiste branch staan en up-to-date zijn
          git fetch origin "$TARGET_BRANCH"
          git switch "$TARGET_BRANCH" || git switch -c "$TARGET_BRANCH" --track "origin/$TARGET_BRANCH"
          git pull --rebase --autostash origin "$TARGET_BRANCH" || true

          # 3) Zet de gestashte artifacts terug
          git stash pop || true

          # 4) Verplaats pdf's (indien aanwezig) en stage alles
          if [[ "${{ steps.config.outputs.grep }}" == "true" ]] && ls static/*.pdf 1>/dev/null 2>&1; then
            mv static/*.pdf .
          fi

          git add snapshot.html $CHECK_DIR/*.txt || true
          if compgen -G "*.pdf" > /dev/null; then
            git add *.pdf
          fi

          # 5) Commit & push terug naar de branch (expliciet naar heads/, nooit naar een tag)
          git commit -m "Snapshot + checks gegenereerd" || echo "No changes to commit"
          git push --force-with-lease origin HEAD:"refs/heads/$TARGET_BRANCH"

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: |
            snapshot.html
            static/*.pdf
            media/**/*
            js/**/*
            data/**/*
